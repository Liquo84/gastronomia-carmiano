name: Pubblica il sito

# Ogni volta che si carica una modifica sul ramo main, la cartella "sito"
# viene pubblicata su GitHub Pages. Nessun passaggio manuale.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepara la cartella da pubblicare
        # Il segnaposto __V__ negli indirizzi di stile e script diventa il codice
        # del commit: a ogni modifica gli indirizzi cambiano e i browser non
        # possono tenere in cache uno script vecchio con una pagina nuova.
        run: |
          touch sito/.nojekyll
          sed -i "s/__V__/${GITHUB_SHA::7}/g" sito/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: deploy
        uses: actions/deploy-pages@v4
